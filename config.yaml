# One top-level section per block. Add yours below; don't edit other sections.

instagram_sponsors:          # block 3b
  model: claude-opus-5-5
  effort: low                # extraction is simple; raise only if checks drop too much
  max_tokens: 4096
  price_usd_per_mtok:        # for the cost ledger
    claude-opus-5-5: {input: 4.00, output: 20.00}
  match:
    min_confidence: 1.0      # take a company only at or above this confidence_score. Live (22 Nov):
                             # 1.0 = same name; 0.8 = the words overlap, e.g. "Maharashtra Times" ->
                             # "Times of Maharashtra News" (a different paper), so 0.8 gave wrong facts
    ambiguity_margin: 0.05   # another company within this of the top score = ambiguous
    identify_batch_size: 25  # names per /company/identify call (API max 25)

brief:                       # block 4: host's description -> Brief
  model: claude-opus-5-5
  effort: low                # extraction only; code checks every value against the text
  max_tokens: 4096
  price_usd_per_mtok:
    claude-opus-5-5: {input: 4.00, output: 20.00}
  # The profile is decided by code from the words the host used for the event type,
  # so two wordings of the same event get the same profile. Whole words; plurals match.
  profile_keywords:
    conference: [conference, summit, conclave, symposium, expo, forum, convention, hackathon, meetup, tech fest]
    concert: [concert, music festival, music fest, gig, live music, dj night, edm]

scoring:                     # block 4: weights per profile; each profile sums to 1
  profiles:
    conference:
      past_sponsorships: 0.30
      audience_fit: 0.25
      active_hiring: 0.15
      budget: 0.15
      city_presence: 0.10
      reachable_contact: 0.05
    concert:
      past_sponsorships: 0.30
      audience_fit: 0.20
      active_hiring: 0.20
      budget: 0.15
      city_presence: 0.10
      reachable_contact: 0.05
  restricted_categories: []  # excluded for every event; hosts add their own in the brief
  # Words to look for in a candidate's Crustdata industries, per category name.
  # A category not listed here is matched by its own name.
  category_keywords:
    alcohol: [alcohol, wine, spirit, beer, brew, distill, liquor]
    tobacco: [tobacco, cigarette]
    gambling: [gambling, casino, betting]

candidates:                  # block 3: candidate pools
  country: India
  country_code: IND          # how Crustdata stores the country on post authors
  signals_full_at:           # verified facts (distinct sources) that make a signal 1.0
    past_sponsorships: 2
    active_hiring: 3
    city_presence: 1
  hiring:
    days: 30
    title_keywords: [sponsorship, partnerships, brand manager, event marketing, brand marketing]
    limit: 100               # job postings, ~0.03 credits each
  past_sponsors:
    days: 365
    sponsor_words: [sponsor, sponsors, sponsored, sponsorship]
    not_sponsor_roles: [venue, media]   # block 3b roles that don't pay, so don't count
    event_words:
      conference: [conference, summit]
      concert: [concert, music festival]
    linkedin_posts: 20       # 0.5 credits each, plus one model call each
    instagram_posts: 5       # 1 credit each to fetch, plus one model call each
  company_search:
    limit: 25                # per search, 0.03 credits each
    employee_ranges: ["201-500", "501-1000", "1001-5000", "5001-10000", "10001+"]
    industries:              # exact Crustdata values (checked with company autocomplete)
      conference: [Software Development, IT Services and IT Consulting, Financial Services, Banking, Telecommunications]
      concert: [Food and Beverage Services, Food and Beverage Manufacturing, Beverage Manufacturing, Retail Apparel and Fashion, Consumer Electronics, Telecommunications, Entertainment Providers]

outreach:                    # block 6: outreach and replies
  # Every email goes to the team inbox; the real target is only named in the subject.
  sender: set-me@example.com   # team Gmail, or env OUTREACH_SENDER; app password in env OUTREACH_APP_PASSWORD
  team_inbox: set-me@example.com     # or env OUTREACH_TEAM_INBOX
  host_inbox: null           # handoffs to the host; null = team inbox
  smtp_host: smtp.gmail.com
  smtp_port: 465
  imap_host: imap.gmail.com
  reply_lookback_days: 7
  require_verified_host: true   # outreach is blocked until host_check returns verified Evidence
  opt_out_line: "Not the right person, or don't want these emails? Reply \"unsubscribe\" and we won't contact you again."
  contact_roles:             # best first; matched against the person's current title
    - Head of Partnerships
    - Partnerships
    - Sponsorship
    - Brand Manager
    - Event Marketing
    - Head of Marketing
    - Marketing Manager
    - CMO
  contact_exclude_titles:    # a title with any of these words is never picked, whatever else it says
    - private equity           # whole words, plural allowed ("investor" also matches "Investors")
    - venture
    - investor
    - recruiter
    - recruiting
    - recruitment
    - talent
    - legal
    - finance
    - intern                   # not a decision-maker; "International" doesn't match
    - internship
    - trainee
  follow_up_after_days: 3
  max_follow_ups: 2
  meeting_minutes: 30
  meeting_slots:             # handed out in order, one per booked meeting (IST)
    - "2026-11-24T15:00:00+05:30"
    - "2026-11-24T16:00:00+05:30"
    - "2026-11-25T11:00:00+05:30"
    - "2026-11-25T15:00:00+05:30"
  booking_link: null         # optional, e.g. a Calendly link, added to every invite email
  model: claude-opus-5-5     # drafts pitches and answers, classifies replies; code checks every number
  effort: low
  max_tokens: 2048
  price_usd_per_mtok:
    claude-opus-5-5: {input: 4.00, output: 20.00}

backtest:                    # block 5: do past events' real sponsors rank above non-sponsors?
  min_sponsors: 2            # resolved sponsors an event needs to be tested
  top_k: 10                  # recall is measured in the top k of the ranking
  # Floors for reporting a result at all (set before looking at any result).
  # Below them the report says "cannot verify" and what's missing.
  min_events: 5
  min_decided_share: 0.2     # share of sponsor/non-sponsor pairs not tied (mostly ties = no signal)
  min_sponsors_with_history: 10   # real sponsors with an earlier sponsorship in the data (added after
                                  # a trial where 0 of 76 had one: no repeats means nothing to test)
